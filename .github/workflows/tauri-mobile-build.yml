name: EffiLife mobile build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android

permissions:
  contents: read

concurrency:
  group: effilife-mobile-build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    if: inputs.target == 'android'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Synchronize desktop release version
        run: python scripts/sync_desktop_version.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: time-helper/desk/package-lock.json

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: time-helper/desk
        run: npm ci

      - name: Validate mobile boundary and contracts
        run: |
          python scripts/check_mobile_release_config.py
          python -m pytest -q tests/test_mobile_build_scripts.py tests/test_mobile_release_config.py tests/test_mobile_workflow.py

      - name: Build shared mobile frontend
        run: python scripts/build_frontend.py

      - name: Initialize Tauri Android project
        working-directory: time-helper/desk
        run: npm run tauri -- android init --ci --skip-targets-install --config src-tauri/tauri.mobile.conf.json

      - name: Verify Android native build environment
        run: python scripts/check_build_environment.py --target android

      - name: Build Android APK
        working-directory: time-helper/desk
        run: npm run mobile:android:build

      - name: Verify Android artifact
        run: >-
          python scripts/verify_mobile_artifacts.py
          --directory time-helper/desk/src-tauri/gen/android/app/build/outputs/apk
          --target android

      - name: Generate Android checksums
        run: >-
          python scripts/generate_checksums.py
          --directory time-helper/desk/src-tauri/gen/android/app/build/outputs/apk
          --output release-checksums/EffiLife-android.sha256
          --extension .apk

      - name: Generate Android release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --directory time-helper/desk/src-tauri/gen/android/app/build/outputs/apk
          --output release-checksums/EffiLife-android.manifest.json
          --version-file time-helper/VERSION
          --target android
          --extension .apk

      - name: Verify Android release manifest
        run: >-
          python scripts/verify_release_manifest.py
          --manifest release-checksums/EffiLife-android.manifest.json
          --directory time-helper/desk/src-tauri/gen/android/app/build/outputs/apk
          --version-file time-helper/VERSION
          --target android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EffiLife-android-apk
          path: |
            time-helper/desk/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            release-checksums/EffiLife-android.sha256
            release-checksums/EffiLife-android.manifest.json
          if-no-files-found: error
