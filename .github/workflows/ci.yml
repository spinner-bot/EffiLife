name: EffiLife CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effilife-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python tests and desktop build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: time-helper/desk/package-lock.json

      - name: Install desktop dependencies
        working-directory: time-helper/desk
        run: npm ci

      - name: Run full Python test suite
        run: python -m pytest -q

      - name: Build desktop frontend
        working-directory: time-helper/desk
        run: npm run build
