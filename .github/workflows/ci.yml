name: EffiLife CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effilife-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python tests and desktop build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Synchronize desktop release version
        run: python scripts/sync_desktop_version.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            time-helper/desk/package-lock.json
            to-dos/ui/package-lock.json

      - name: Install desktop dependencies
        working-directory: time-helper/desk
        run: npm ci

      - name: Run full Python test suite
        run: |
          set -o pipefail
          python -m pytest -q --maxfail=1 -ra 2>&1 | tee pytest-failure.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            {
              echo '### pytest failure (first failing case)'
              echo '```text'
              tail -n 120 pytest-failure.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_tail=$(tail -n 40 pytest-failure.log | tr '\n' ' ' | tr '\r' ' ')
            failure_tail=${failure_tail//'%'/'%25'}
            failure_tail=${failure_tail//$'\n'/'%0A'}
            failure_tail=${failure_tail//$'\r'/'%0D'}
            echo "::error file=pytest-failure.log,line=1,title=pytest failure::$failure_tail"
          fi
          exit "$test_status"

      - name: Run unified cross-module integration suite
        run: python scripts/run_integration.py test

      - name: Run unified workspace startup smoke check
        run: python scripts/smoke_startup.py

      - name: Validate desktop and mobile release contracts
        run: |
          python scripts/check_release_config.py
          python scripts/check_mobile_release_config.py

      - name: Build desktop frontend
        run: python scripts/build_frontend.py

      - name: Install compatibility UI dependencies
        working-directory: to-dos/ui
        run: npm ci

      - name: Audit compatibility UI dependencies
        working-directory: to-dos/ui
        # Audit the committed lockfile instead of npm's installed-tree
        # endpoint. This is deterministic in CI and avoids registry 400s
        # caused by platform-specific optional packages in node_modules.
        run: npm audit --audit-level=high --package-lock-only

      - name: Build compatibility UI
        run: python scripts/build_todos_ui.py

      - name: Collect launcher diagnostics on failure
        if: ${{ failure() }}
        run: python launcher/start.py --diagnose > ci-launcher-diagnostics.json || true

      - name: Upload launcher diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: effilife-ci-diagnostics-${{ github.run_id }}
          path: |
            ci-launcher-diagnostics.json
            pytest-failure.log
          if-no-files-found: warn
