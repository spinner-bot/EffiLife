name: EffiLife mobile boundary

on:
  workflow_dispatch:
  push:
    paths:
      - 'time-helper/desk/src/**'
      - 'time-helper/desk/package.json'
      - 'time-helper/desk/package-lock.json'
      - 'time-helper/desk/src-tauri/tauri.mobile.conf.json'
      - 'scripts/check_mobile_release_config.py'
      - 'tests/test_mobile_*.py'

jobs:
  contract:
    name: mobile frontend and configuration contract
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: time-helper/desk/package-lock.json

      - name: Install frontend dependencies
        working-directory: time-helper/desk
        run: npm ci

      - name: Validate mobile sidecar boundary
        run: python scripts/check_mobile_release_config.py

      - name: Validate mobile command contract
        run: python -m pytest -q tests/test_mobile_build_scripts.py tests/test_mobile_release_config.py

      - name: Build shared mobile frontend
        working-directory: time-helper/desk
        run: npm run build
