name: EffiLife desktop release

on:
  workflow_dispatch:
    inputs:
      previous_installer_url:
        description: 'Optional URL of the previous Windows NSIS installer for upgrade validation'
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: effilife-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: to-dos compatibility UI
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: to-dos/ui/package-lock.json

      - name: Install compatibility UI dependencies
        working-directory: to-dos/ui
        run: npm ci

      - name: Audit compatibility UI lockfile
        working-directory: to-dos/ui
        run: npm audit --audit-level=high --package-lock-only

      - name: Build compatibility UI
        run: python scripts/build_todos_ui.py

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-nsis
            os: windows-latest
            bundle: nsis
            target: windows-nsis
            extension: .exe
            artifact: time-helper/desk/src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-deb
            os: ubuntu-22.04
            bundle: deb
            target: linux-deb
            extension: .deb
            artifact: time-helper/desk/src-tauri/target/release/bundle/deb/*.deb
          - name: linux-appimage
            os: ubuntu-22.04
            bundle: appimage
            target: linux-appimage
            extension: .AppImage
            artifact: time-helper/desk/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos-dmg
            os: macos-latest
            bundle: dmg
            target: macos-dmg
            extension: .dmg
            artifact: time-helper/desk/src-tauri/target/release/bundle/dmg/*.dmg

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux bundling dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Synchronize desktop release version
        run: python scripts/sync_desktop_version.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: time-helper/desk/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify desktop build environment
        run: python scripts/check_build_environment.py --target desktop

      - name: Install frontend dependencies
        working-directory: time-helper/desk
        run: npm ci

      - name: Install sidecar builder
        run: python -m pip install pyinstaller pytest

      - name: Validate desktop release configuration
        run: python scripts/check_release_config.py

      - name: Validate mobile build boundary
        run: python scripts/check_mobile_release_config.py

      - name: Run integration and release contract tests
        run: python -m pytest -q

      - name: Run unified cross-module integration suite
        run: python scripts/run_integration.py test

      - name: Run unified workspace startup smoke check
        run: python scripts/smoke_startup.py

      - name: Build and package installer
        working-directory: time-helper/desk
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Sign Windows installer for formal release
        if: matrix.target == 'windows-nsis' && vars.EFFILIFE_FORMAL_RELEASE_ENABLED == 'true'
        shell: pwsh
        env:
          EFFILIFE_WINDOWS_CERT_BASE64: ${{ secrets.EFFILIFE_WINDOWS_CERT_BASE64 }}
          EFFILIFE_WINDOWS_CERT_PASSWORD: ${{ secrets.EFFILIFE_WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EFFILIFE_WINDOWS_CERT_BASE64)) {
            throw 'Formal release is enabled but EFFILIFE_WINDOWS_CERT_BASE64 is not configured'
          }
          if ($null -eq (Get-Command signtool.exe -ErrorAction SilentlyContinue)) {
            throw 'Formal release is enabled but signtool.exe is unavailable'
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'effilife-release.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:EFFILIFE_WINDOWS_CERT_BASE64))
          try {
            $installer = Get-ChildItem -LiteralPath 'time-helper/desk/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
            if ($null -eq $installer) { throw 'Formal release signing found no Windows installer' }
            & signtool.exe sign /fd SHA256 /f $certificate /p $env:EFFILIFE_WINDOWS_CERT_PASSWORD /tr 'http://timestamp.digicert.com' /td SHA256 $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
            & signtool.exe verify /pa $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test Windows installer lifecycle
        if: matrix.target == 'windows-nsis'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'time-helper/desk/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer smoke test found no Windows installer' }
          $target = Join-Path $env:RUNNER_TEMP 'effilife-installer-smoke'
          python scripts/smoke_windows_installer.py --installer $installer.FullName --target $target --version-file time-helper/VERSION

      - name: Download previous installer for upgrade validation
        if: matrix.target == 'windows-nsis' && inputs.previous_installer_url != ''
        shell: pwsh
        env:
          PREVIOUS_INSTALLER_URL: ${{ inputs.previous_installer_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_INSTALLER_URL)) {
            throw 'Upgrade validation was requested without a previous installer URL'
          }
          Invoke-WebRequest -Uri $env:PREVIOUS_INSTALLER_URL -OutFile (Join-Path $env:RUNNER_TEMP 'effilife-previous-installer.exe')

      - name: Smoke test Windows installer upgrade
        if: matrix.target == 'windows-nsis' && inputs.previous_installer_url != ''
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'time-helper/desk/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'Upgrade smoke test found no current Windows installer' }
          $target = Join-Path $env:RUNNER_TEMP 'effilife-installer-upgrade-smoke'
          $data = Join-Path $env:RUNNER_TEMP 'effilife-upgrade-data'
          python scripts/smoke_windows_upgrade.py --previous-installer (Join-Path $env:RUNNER_TEMP 'effilife-previous-installer.exe') --installer $installer.FullName --target $target --version-file time-helper/VERSION --data-dir $data

      - name: Verify packaged installer
        run: >-
          python scripts/verify_release_artifacts.py
          --directory time-helper/desk/src-tauri/target/release/bundle/${{ matrix.bundle }}
          --extension ${{ matrix.extension }}
          --version-file time-helper/VERSION

      - name: Generate installer checksums
        run: >-
          python scripts/generate_checksums.py
          --directory time-helper/desk/src-tauri/target/release/bundle/${{ matrix.bundle }}
          --output release-checksums/EffiLife-${{ matrix.name }}.sha256
          --extension ${{ matrix.extension }}
          --prefix EffiLife

      - name: Generate release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --directory time-helper/desk/src-tauri/target/release/bundle/${{ matrix.bundle }}
          --output release-checksums/EffiLife-${{ matrix.name }}.manifest.json
          --version-file time-helper/VERSION
          --target ${{ matrix.target }}
          --extension ${{ matrix.extension }}
          --prefix EffiLife

      - name: Verify release manifest
        run: >-
          python scripts/verify_release_manifest.py
          --manifest release-checksums/EffiLife-${{ matrix.name }}.manifest.json
          --directory time-helper/desk/src-tauri/target/release/bundle/${{ matrix.bundle }}
          --version-file time-helper/VERSION
          --target ${{ matrix.target }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: EffiLife-${{ matrix.name }}-installer
          path: |
            ${{ matrix.artifact }}
            release-checksums/EffiLife-${{ matrix.name }}.sha256
            release-checksums/EffiLife-${{ matrix.name }}.manifest.json
          if-no-files-found: error

  publish:
    name: publish tagged release
    # Unsigned installers remain available as internal workflow artifacts. A
    # public GitHub Release requires an explicit repository variable and the
    # Windows signing step above to have run successfully.
    if: startsWith(github.ref, 'refs/tags/v') && vars.EFFILIFE_FORMAL_RELEASE_ENABLED == 'true'
    needs:
      - compatibility
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5

      - name: Verify release tag matches desktop version
        run: |
          expected_tag="v$(cat time-helper/VERSION)"
          test "${GITHUB_REF_NAME}" = "${expected_tag}" || {
            echo "Release tag ${GITHUB_REF_NAME} does not match ${expected_tag}"
            exit 1
          }

      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: EffiLife-*-installer
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "EffiLife ${GITHUB_REF_NAME}" \
            --generate-notes
