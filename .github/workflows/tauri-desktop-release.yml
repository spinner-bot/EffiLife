name: EffiLife desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  compatibility:
    name: to-dos compatibility UI
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: to-dos/ui/package-lock.json

      - name: Install compatibility UI dependencies
        working-directory: to-dos/ui
        run: npm ci

      - name: Build compatibility UI
        working-directory: to-dos/ui
        run: npm run build

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-nsis
            os: windows-latest
            bundle: nsis
            target: windows-nsis
            extension: .exe
            artifact: time-helper/desk/src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-deb
            os: ubuntu-22.04
            bundle: deb
            target: linux-deb
            extension: .deb
            artifact: time-helper/desk/src-tauri/target/release/bundle/deb/*.deb
          - name: linux-appimage
            os: ubuntu-22.04
            bundle: appimage
            target: linux-appimage
            extension: .AppImage
            artifact: time-helper/desk/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos-dmg
            os: macos-latest
            bundle: dmg
            target: macos-dmg
            extension: .dmg
            artifact: time-helper/desk/src-tauri/target/release/bundle/dmg/*.dmg

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux bundling dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Synchronize desktop release version
        run: python scripts/sync_desktop_version.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: time-helper/desk/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify desktop build environment
        run: python scripts/check_build_environment.py --target desktop

      - name: Install frontend dependencies
        working-directory: time-helper/desk
        run: npm ci

      - name: Install sidecar builder
        run: python -m pip install pyinstaller pytest

      - name: Validate desktop release configuration
        run: python scripts/check_release_config.py

      - name: Validate mobile build boundary
        run: python scripts/check_mobile_release_config.py

      - name: Run integration and release contract tests
        run: python -m pytest -q

      - name: Run unified cross-module integration suite
        run: python scripts/run_integration.py test

      - name: Build and package installer
        working-directory: time-helper/desk
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Verify packaged installer
        run: >-
          python scripts/verify_release_artifacts.py
          --directory time-helper/desk/src-tauri/target/release/bundle/${{ matrix.bundle }}
          --extension ${{ matrix.extension }}
          --version-file time-helper/VERSION

      - name: Generate installer checksums
        run: >-
          python scripts/generate_checksums.py
          --directory time-helper/desk/src-tauri/target/release/bundle/${{ matrix.bundle }}
          --output release-checksums/EffiLife-${{ matrix.name }}.sha256
          --extension ${{ matrix.extension }}

      - name: Generate release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --directory time-helper/desk/src-tauri/target/release/bundle/${{ matrix.bundle }}
          --output release-checksums/EffiLife-${{ matrix.name }}.manifest.json
          --version-file time-helper/VERSION
          --target ${{ matrix.target }}
          --extension ${{ matrix.extension }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EffiLife-${{ matrix.name }}-installer
          path: |
            ${{ matrix.artifact }}
            release-checksums/EffiLife-${{ matrix.name }}.sha256
            release-checksums/EffiLife-${{ matrix.name }}.manifest.json
          if-no-files-found: error

  publish:
    name: publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - compatibility
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5

      - name: Verify release tag matches desktop version
        run: |
          expected_tag="v$(cat time-helper/VERSION)"
          test "${GITHUB_REF_NAME}" = "${expected_tag}" || {
            echo "Release tag ${GITHUB_REF_NAME} does not match ${expected_tag}"
            exit 1
          }

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EffiLife-*-installer
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "EffiLife ${GITHUB_REF_NAME}" \
            --generate-notes
