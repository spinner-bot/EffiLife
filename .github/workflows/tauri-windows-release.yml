name: EffiLife Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: time-helper/desk/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: time-helper/desk
        run: npm ci

      - name: Install sidecar builder
        run: python -m pip install pyinstaller

      - name: Build and package NSIS installer
        working-directory: time-helper/desk
        run: npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EffiLife-windows-installer
          path: |
            time-helper/desk/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
