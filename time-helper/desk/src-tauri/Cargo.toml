[package]
name = "efflife-desk"
version = "0.1.0"
description = "浪兮效率时钟桌面版"
authors = ["浪兮"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "efflife_desk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
